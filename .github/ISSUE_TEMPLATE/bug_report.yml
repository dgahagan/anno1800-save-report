name: Bug report
description: The tool fails, or a number in the report does not match the game.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Privacy:** a savegame and its decoded XML hold your Ubisoft account id and company name.
        Do not attach `.a7s` files, decoded XML or `latest.json` here. Paste only the lines that matter, and replace names if you want.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran, what you expected and what you got. For a wrong number, give the value in the report and the value on the game screen.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error output or report lines
      render: text
  - type: input
    id: build
    attributes:
      label: Game build
      description: The `build` number in the report header, for example 1412158.
  - type: input
    id: dlc
    attributes:
      label: DLC active in the save
      description: The "DLC active in this save" line of the report.
  - type: input
    id: env
    attributes:
      label: Setup
      description: Distribution, Steam native or Flatpak, Python version, .NET SDK version.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not attach a savegame, decoded XML or latest.json.
          required: true
